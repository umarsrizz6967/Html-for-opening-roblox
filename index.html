<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Launching Roblox...</title>
    <script>
        window.onload = function() {
            // Open Roblox Web in a new tab
            window.open('https://www.roblox.com', '_blank');

            // Redirect the current page to launch the Roblox application
            window.location.href = 'roblox://';
        };
    </script>
</head>
<body style="background-color: #000; color: #fff;">
</body>
</html>
