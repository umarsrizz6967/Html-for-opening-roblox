<!DOCTYPE html>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Redirect</title>
</head>
<body>
<script>
    const isAndroid = /Android/i.test(navigator.userAgent);

    if (isAndroid) {
        // Open Roblox in a browser tab.
        window.open("https://www.roblox.com/", "_blank");

        // Attempt to launch the installed Roblox app.
        window.location.href =
            "intent://home#Intent;" +
            "scheme=roblox;" +
            "package=com.roblox.client;" +
            "end;";
    } else {
        window.open("https://www.roblox.com/", "_blank");
    }
</script>
</body>
</html>
