<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Redirecting</title>
</head>
<body>
<script>
    if (/Android/i.test(navigator.userAgent)) {
        window.location.href = "roblox://";
    } else {
        window.open("https://www.roblox.com/", "_blank");
    }
</script>
</body>
</html>
