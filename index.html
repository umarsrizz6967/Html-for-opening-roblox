<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Roblox</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }

        button {
            background: #e2231a;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
        }

        a {
            color: #60a5fa;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h1>🎮 Open Roblox</h1>
    <p>Click below to continue to Roblox.</p>

    <button id="openRoblox">Open Roblox</button>

    <a href="https://www.roblox.com/" target="_blank" rel="noopener">
        Open Roblox website instead
    </a>

    <script>
        const button = document.getElementById("openRoblox");

        button.addEventListener("click", function () {
            const isAndroid = /Android/i.test(navigator.userAgent);

            if (isAndroid) {
                // Try to open Roblox using Android's app-link mechanism.
                window.location.href =
                    "https://www.roblox.com/home";

                // If Android does not open the app, the website
                // remains available as a fallback.
            } else {
                // On PC, open Roblox in a new browser tab.
                const newTab = window.open(
                    "https://www.roblox.com/",
                    "_blank",
                    "noopener"
                );

                if (!newTab) {
                    // If the browser blocks the new tab, open in this tab.
                    window.location.href = "https://www.roblox.com/";
                }
            }
        });
    </script>

</body>
</html>
